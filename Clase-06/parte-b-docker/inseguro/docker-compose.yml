# =============================================================================
#  BurgerBank · Microservicios · VERSIÓN INSEGURA (Clase 6)
#  5 contenedores: web (nginx), pedidos (API REST), facturacion (web service
#  SOAP), cache (Redis) y monitor.
#  Errores a propósito: todo publicado en 0.0.0.0, una sola red, secretos en
#  texto plano, contenedor privilegiado, socket de Docker montado y sin límites.
# =============================================================================
name: burgerbank

services:
  web:
    image: nginx:1.21
    container_name: web
    ports:
      - "80:80"
    volumes:
      - ./web/default.conf:/etc/nginx/conf.d/default.conf
      - ./web/index.html:/usr/share/nginx/html/index.html
      - ./web/descargas:/usr/share/nginx/html/descargas
    depends_on:
      - pedidos
      - facturacion
    restart: always

  pedidos:
    build: ./pedidos
    image: burgerbank/pedidos:1.0
    container_name: pedidos
    privileged: true
    ports:
      - "5000:5000"
    environment:
      REDIS_HOST: cache
      REDIS_PASSWORD: ""
      ADMIN_TOKEN: bb-admin-7f3a9c2e1d
    depends_on:
      - cache
    restart: always

  facturacion:
    build: ./facturacion
    image: burgerbank/facturacion:1.0
    container_name: facturacion
    ports:
      - "5001:5001"
    restart: always

  cache:
    image: redis:6.0
    container_name: cache
    ports:
      - "16379:6379"
    restart: always

  monitor:
    image: burgerbank/pedidos:1.0
    container_name: monitor
    command: ["sleep", "infinity"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
