# =============================================================================
#  BurgerBank · Microservicios · VERSIÓN ENDURECIDA (Clase 6)
#  - Solo "web" publica puertos (80 y 443); pedidos, facturacion y cache en una red
#    interna sin salida a internet.
#  - Secretos como archivos montados en /run/secrets (no en variables).
#  - Sin privilegios: cap_drop ALL, no-new-privileges, usuario no root,
#    sistema de archivos de solo lectura.
#  - Límites de memoria, CPU y procesos; healthchecks; logs rotados.
#  - Ya no existe el contenedor "monitor" con el socket de Docker.
# =============================================================================
name: burgerbank

x-endurecido: &endurecido
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  restart: on-failure:5
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  web:
    <<: *endurecido
    image: nginxinc/nginx-unprivileged:stable-alpine
    container_name: web
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./web/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./certs:/etc/nginx/certs:ro
    tmpfs:
      - /tmp:size=16m
    networks: [frontend, backend]
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 100
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/salud"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      pedidos:
        condition: service_healthy
      facturacion:
        condition: service_healthy

  pedidos:
    <<: *endurecido
    build: ./pedidos
    image: burgerbank/pedidos:2.0
    container_name: pedidos
    environment:
      REDIS_HOST: cache
    secrets:
      - redis_password
      - api_keys
    tmpfs:
      - /tmp:size=16m
    networks: [backend]
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100
    depends_on:
      cache:
        condition: service_healthy

  facturacion:
    <<: *endurecido
    build: ./facturacion
    image: burgerbank/facturacion:2.0
    container_name: facturacion
    secrets:
      - api_keys
    tmpfs:
      - /tmp:size=16m
    networks: [backend]
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 100

  cache:
    <<: *endurecido
    image: redis:7.4-alpine
    container_name: cache
    user: "999:1000"
    command: ["redis-server", "--aclfile", "/run/secrets/redis_acl",
              "--save", "", "--appendonly", "no", "--protected-mode", "yes"]
    secrets:
      - redis_acl
    tmpfs:
      - /data:size=32m
    networks: [backend]
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qE 'PONG|NOAUTH'"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  frontend: {}
  backend:
    internal: true          # sin salida a internet ni puertos publicados

secrets:
  redis_password:
    file: ./secrets/redis_password.txt
  redis_acl:
    file: ./secrets/redis_users.acl
  api_keys:
    file: ./secrets/api_keys.json
