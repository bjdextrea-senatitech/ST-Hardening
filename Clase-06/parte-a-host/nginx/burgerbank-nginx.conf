# =============================================================================
#  Nginx · sitio BurgerBank ENDURECIDO (Clase 6, Parte A)
#  Copiar a /etc/nginx/sites-available/burgerbank
#  (server_tokens off se pone en /etc/nginx/nginx.conf, Lab A4)
# =============================================================================

limit_req_zone $binary_remote_addr zone=sitio:10m rate=5r/s;   # 5 peticiones/s por IP

# --- 8082: solo redirige a HTTPS (8442) ---------------------------------------
server {
    listen 8082;
    server_name _;
    return 301 https://$host:8442$request_uri;
}

# --- 8442: HTTPS ---------------------------------------------------------------
server {
    listen 8442 ssl http2;
    server_name _;
    root /var/www/nginx-lab;
    index index.html;

    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    client_max_body_size 100k;
    client_body_timeout   10s;
    client_header_timeout 10s;

    add_header Strict-Transport-Security "max-age=300" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    if ($request_method !~ ^(GET|POST|HEAD)$) {
        return 405;
    }

    autoindex off;

    location ~ /\. {
        deny all;
    }

    location / {
        limit_req zone=sitio burst=10 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ =404;
    }
}
