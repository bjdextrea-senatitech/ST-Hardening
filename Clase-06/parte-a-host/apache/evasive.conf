# =============================================================================
#  mod_evasive · límite de peticiones por IP (Clase 6, Parte A)
#  Copiar a /etc/apache2/mods-available/evasive.conf
#  Si una IP pide la MISMA página más de 5 veces en 1 segundo (o más de 50
#  páginas del sitio), queda bloqueada 10 segundos (respuesta 403).
# =============================================================================
<IfModule mod_evasive20.c>
    DOSHashTableSize    3097
    DOSPageCount        5
    DOSPageInterval     1
    DOSSiteCount        50
    DOSSiteInterval     1
    DOSBlockingPeriod   10
    DOSLogDir           "/var/log/apache2/evasive"
</IfModule>
