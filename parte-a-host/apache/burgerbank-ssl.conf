# =============================================================================
#  Apache · sitio BurgerBank ENDURECIDO (Clase 6, Parte A)
#  Copiar a /etc/apache2/sites-available/burgerbank-ssl.conf
#  Requiere: a2enmod ssl headers rewrite
# =============================================================================

# --- 8081: solo redirige a HTTPS (8441), conservando el nombre que usó el cliente ---
<VirtualHost *:8081>
    ServerName burgerbank.lab
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^([^:]+)
    RewriteRule ^ https://%1:8441%{REQUEST_URI} [R=301,L]
</VirtualHost>

# --- 8441: HTTPS ---------------------------------------------------------------
<VirtualHost *:8441>
    ServerName burgerbank.lab
    DocumentRoot /var/www/html

    # TLS: certificado autofirmado de Ubuntu (paquete ssl-cert), solo TLS 1.2 y 1.3
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off
    SSLSessionTickets off

    # Cabeceras de seguridad ("always" = también en respuestas de error)
    Header always set Strict-Transport-Security "max-age=300"
    Header always set Content-Security-Policy "default-src 'self'; frame-ancestors 'none'"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always unset X-Powered-By

    # Cuerpos de petición pequeños (100 KB)
    LimitRequestBody 102400

    <Directory /var/www/html>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        # Solo los métodos que el sitio usa
        <LimitExcept GET POST HEAD>
            Require all denied
        </LimitExcept>
    </Directory>

    # Nunca servir archivos ocultos (.env, .git, .htpasswd)
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/\.">
        Require all denied
    </DirectoryMatch>

    ErrorLog  ${APACHE_LOG_DIR}/burgerbank-error.log
    CustomLog ${APACHE_LOG_DIR}/burgerbank-access.log combined
</VirtualHost>
