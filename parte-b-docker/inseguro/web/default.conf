# =============================================================================
#  Proxy web (nginx) · VERSIÓN INSEGURA
#  Solo HTTP, muestra la versión de nginx, lista directorios y no pone
#  ninguna cabecera de seguridad ni límite de peticiones.
# =============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # "Carpeta de descargas" con listado de directorio activado
    location /descargas/ {
        autoindex on;
    }

    # Todo lo que empieza con /api/ va al microservicio de pedidos
    location /api/ {
        proxy_pass http://pedidos:5000;
    }

    # Web service SOAP de facturación
    location /ws/ {
        proxy_pass http://facturacion:5001;
    }
}
