# =============================================================================
#  Proxy web (nginx sin privilegios) · VERSIÓN ENDURECIDA
#  - Corre como usuario 101 y escucha en 8080/8443 (puertos altos)
#  - HTTP solo redirige a HTTPS; TLS 1.2 y 1.3
#  - Oculta la versión, sin listado de directorios, cabeceras de seguridad
#  - Límite de peticiones por IP y de tamaño de cuerpo; solo GET/POST/HEAD
# =============================================================================

server_tokens off;                                   # no mostrar la versión de nginx
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;   # 5 peticiones/s por IP

# --- HTTP: solo redirige a HTTPS -------------------------------------------
server {
    listen 8080;
    server_name _;

    location = /salud {                              # usado solo por el healthcheck
        access_log off;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/web.crt;
    ssl_certificate_key /etc/nginx/certs/web.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    client_max_body_size 8k;                         # cuerpos pequeños
    client_body_timeout  10s;
    client_header_timeout 10s;

    # Cabeceras de seguridad (always = también en respuestas de error)
    add_header Strict-Transport-Security "max-age=300" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Solo los métodos que la aplicación usa
    if ($request_method !~ ^(GET|POST|HEAD)$) {
        return 405;
    }

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    # Nunca servir archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    location /api/ {
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://pedidos:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # Web service SOAP: mismo límite de peticiones, cuerpo de hasta 16 KB
    location /ws/ {
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://facturacion:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Server;
    }
}
